name: Build TCS (desktop, headless, Docker)

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-universal:
    if: false
    name: macOS universal (x86_64 + arm64 DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build (Tauri - universal)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload universal DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcs-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
  windows-amd64:
    name: Desktop - Windows amd64 (MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build (Tauri)
        run: npm run tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcs-windows-amd64-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  ubuntu-2204-amd64:
    name: Desktop - Ubuntu 22.04 amd64 (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri + PCSC + AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget pkg-config file \
            libssl-dev libxdo-dev libudev-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            squashfs-tools fuse \
            pcscd libpcsclite-dev libccid usbutils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build (Tauri)
        run: npm run tauri build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcs-ubuntu-2204-amd64-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # Headless server build: `--no-default-features` drops the Tauri desktop app (no
  # window, tray or webview libraries); the UI is the embedded web UI. Plain executables.
  windows-amd64-headless:
    name: Headless - Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build web UI (embedded in the binary)
        run: npm run build

      - name: Build (headless)
        working-directory: src-tauri
        run: cargo build --release --locked --no-default-features

      - name: Name the binary
        shell: bash
        run: cp src-tauri/target/release/tacho-card-server.exe tcs-headless-windows-amd64.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcs-headless-windows-amd64
          path: tcs-headless-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14

  ubuntu-2204-amd64-headless:
    name: Headless - Linux amd64 (Ubuntu 22.04 glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (PCSC, OpenSSL, udev for serialport)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libpcsclite-dev libudev-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build web UI (embedded in the binary)
        run: npm run build

      - name: Build (headless)
        working-directory: src-tauri
        run: cargo build --release --locked --no-default-features

      - name: Run unit tests
        working-directory: src-tauri
        run: cargo test --locked --no-default-features --lib

      - name: Name the binary
        run: cp src-tauri/target/release/tacho-card-server tcs-headless-linux-amd64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcs-headless-linux-amd64
          path: tcs-headless-linux-amd64
          if-no-files-found: error
          retention-days: 14

  # Docker image of the headless build. Built on every run to check it still builds;
  # pushed to GitHub Container Registry only for v* tags.
  docker:
    name: Docker image (linux/amd64)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tacho-card-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=ref,event=pr

      - name: Build (and push on v* tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release (on v* tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-amd64, ubuntu-2204-amd64, windows-amd64-headless, ubuntu-2204-amd64-headless, docker]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Only our tcs-* artifacts: docker/build-push-action also uploads a build record
      # (<repo>~<id>.dockerbuild), which isn't a release asset.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tcs-*
          path: dist
          merge-multiple: true

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.msi
            dist/*.AppImage
            dist/tcs-headless-windows-amd64.exe
            dist/tcs-headless-linux-amd64
          fail_on_unmatched_files: true
