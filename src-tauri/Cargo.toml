[package]
name = "tacho-card-server"
version = "0.0.2"
description = "Tachograph authentication application"
authors = ["Jessica Doyle"]
license = ""
repository = "https://github.com/astra-telematics/Tacho-Card-Server"
edition = "2021"
rust-version = "1.84.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# `mobile` is set by tauri-build, which the headless build doesn't run.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mobile)"] }

[features]
default = ["desktop"]
# The Tauri desktop app (window, tray). Without it (`cargo build --no-default-features`)
# the binary is the headless server only, with no Tauri or webview libraries — for
# Docker and other servers.
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-notification",
]

[build-dependencies]
tauri-build = { version = "2.0.4", features = [], optional = true }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.43.0", features = ["full"] }
tauri = { version = "2.2.4", features = ["tray-icon"], optional = true }
reqwest = { version = "0.13.2", features = ["json"] }
log = "0.4"
tauri-plugin-log = { version = "2.0.0-rc", optional = true }
pcsc = "2.9.0"
hex = "0.4.3"
rumqttc = "0.25.1"
chrono = "0.4.39"
serde_yaml = "0.9.34"
lazy_static = "1.5.0"
native-tls = "0.2.13"
tokio-native-tls = "0.3.1"
sys-info = "0.9.1"
once_cell = "1.21.3"
tokio-serial = "5.4.5"
serialport = "4.8.1"
luhn = "1.0.1"
sha2 = "0.10"
rand = "0.8"
tauri-plugin-opener = { version = "2", optional = true }
crc32fast = "1"
flexi_logger = { version = "0.31", features = ["compress"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
argon2 = "0.5"
futures-util = "0.3"
axum = "0.8"
rust-embed = { version = "8", features = ["mime-guess"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Console"] }

