[package]
name = "tacho-card-server"
version = "0.0.1"
description = "Tachograph authentication application"
authors = ["Jessica Doyle"]
license = ""
repository = "https://github.com/astra-telematics/Tacho-Card-Server"
edition = "2021"
rust-version = "1.84.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.43.0", features = ["full"] }
tauri = { version = "2.2.4", features = ["tray-icon"] }
reqwest = { version = "0.13.2", features = ["json"] }
log = "0.4"
tauri-plugin-log = "2.0.0-rc"
pcsc = "2.9.0"
hex = "0.4.3"
rumqttc = "0.25.1"
chrono = "0.4.39"
serde_yaml = "0.9.34"
lazy_static = "1.5.0"
native-tls = "0.2.13"
tokio-native-tls = "0.3.1"
sys-info = "0.9.1"
once_cell = "1.21.3"
tokio-serial = "5.4.5"
serialport = "4.8.1"
luhn = "1.0.1"
sha2 = "0.10"
rand = "0.8"
tauri-plugin-opener = "2"
crc32fast = "1"
flexi_logger = { version = "0.31", features = ["compress"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Console"] }

