# Tacho Card Server, headless. Put this file in a folder such as /volume1/docker/tcs and
# run `docker-compose up -d` there. Create the folders mounted below (./data and the
# downloads folder) first: Synology's Docker won't create a missing bind-mount folder.
#
# First start: the admin password is generated and saved in ./data/config.yaml
# (admin_password). Log in to the web UI as "admin" with it.
#
# Updates: the web UI's account menu offers new releases, installed by the updater
# below. It needs a shared secret in a file named .env beside this one, made once with:
#   echo "UPDATER_TOKEN=$(openssl rand -hex 32)" > .env

services:
  tcs:
    image: ghcr.io/astra-telematics/tacho-card-server:latest
    # Or build it here instead of pulling:
    # build: .
    container_name: tcs
    restart: unless-stopped
    # Reaps pcscd if it exits, and forwards docker stop's SIGTERM to the server.
    init: true
    # host:container. The container side is fixed by the image (and read-only in the
    # UI); to use other ports, change only the host side, e.g. "17878:7878".
    ports:
      # Devices connect here: the one port to open in the firewall.
      - "7878:7878"
      # Web UI. Plain HTTP: keep it on the LAN, e.g. "192.168.1.10:8080:8080" to listen
      # on one address, or put it behind a TLS reverse proxy (DSM: Control Panel → Login
      # Portal → Advanced → Reverse Proxy, with a Let's Encrypt certificate).
      - "8080:8080"
    volumes:
      # config.yaml, tcs.db and logs/.
      - ./data:/data
      # Downloaded tachograph files, one subfolder per company. Point the left side at
      # wherever they should go, e.g. a shared folder: "/volume1/tacho-downloads:/downloads".
      - ./downloads:/downloads
    devices:
      # The USB card reader(s), for the container's own pcscd.
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      # Any USB device, so the container may use a reader whatever its device path. The
      # container's pcscd only looks for readers when it starts, though: after plugging
      # in or replugging a reader, run `docker compose restart tcs`.
      - "c 189:* rmw"
    environment:
      # Download intervals count calendar days in this time zone.
      TZ: Europe/London
      # How the server asks the updater (below, at http://updater:8080) to install a
      # new release.
      TCS_UPDATER_TOKEN: ${UPDATER_TOKEN:?make .env, see the top of this file}
    labels:
      # The only container the updater may update.
      com.centurylinklabs.watchtower.enable: "true"

  # Watchtower: pulls the new image and restarts tcs with it, only when the web UI
  # asks (it never checks on its own). Reachable only from tcs: no ports published.
  updater:
    image: nickfedor/watchtower:1.23.2
    container_name: tcs-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # health: lets the server check the updater is there before offering updates.
      WATCHTOWER_HTTP_API_ENDPOINTS: update,health
      WATCHTOWER_HTTP_API_TOKEN: ${UPDATER_TOKEN:?make .env, see the top of this file}
      # Only containers labelled for it (tcs), and remove the old image afterwards.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      TZ: Europe/London
