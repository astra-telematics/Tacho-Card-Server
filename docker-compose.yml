# Tacho Card Server, headless. On a Synology NAS: Container Manager → Project → Create,
# with this file, in a folder such as /volume1/docker/tcs.
#
# First start: the admin password is generated and saved in ./data/config.yaml
# (admin_password). Log in to the web UI as "admin" with it.

services:
  tcs:
    image: ghcr.io/astra-telematics/tacho-card-server:latest
    # Or build it here instead of pulling:
    # build: .
    container_name: tcs
    restart: unless-stopped
    # Reaps pcscd if it exits, and forwards docker stop's SIGTERM to the server.
    init: true
    ports:
      # Devices connect here: the one port to open in the firewall. Must match
      # connection.listen_port in config.yaml (7878 unless changed).
      - "7878:7878"
      # Web UI. Plain HTTP: keep it on the LAN, e.g. "192.168.1.10:8080:8080" to listen
      # on one address, or put it behind a TLS reverse proxy (DSM: Control Panel → Login
      # Portal → Advanced → Reverse Proxy, with a Let's Encrypt certificate).
      - "8080:8080"
    volumes:
      # config.yaml, tcs.db, logs/ and downloads/.
      - ./data:/data
    devices:
      # The USB card reader(s), for the container's own pcscd.
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      # Any USB device, so a reader that's unplugged and replugged (new device path)
      # still works without restarting the container.
      - "c 189:* rmw"
    environment:
      # Download intervals count calendar days in this time zone.
      TZ: Europe/London
      # TCS_WEB_PORT: "8080"   # change the port mapping above to match
